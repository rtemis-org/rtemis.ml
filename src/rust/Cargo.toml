[package]
name = 'rtemis-ml-r'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.71'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rtemis_ml_r'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9'
rtemis = '0.1'

[profile.release]
lto = true
codegen-units = 1
