name: R CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  r-cmd-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      # R CMD check runs checkbashisms (from devscripts) on configure and cleanup.
      - name: Install checkbashisms
        run: sudo apt-get update && sudo apt-get install -y devscripts
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
          # Save dependencies even when a later check fails.
          cache: always
          cache-version: 1
      - uses: r-lib/actions/check-r-package@v2
        timeout-minutes: 20
        with:
          upload-snapshots: true
          error-on: '"warning"'
          args: 'c("--no-manual", "--as-cran")'
          build_args: 'c("--no-manual", "--compact-vignettes=gs+qpdf")'
      - name: Preserve incomplete check diagnostics
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: check-diagnostics
          path: check
          if-no-files-found: ignore

  rust:
    name: Rust (binding crate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: src/rust
    steps:
      - uses: actions/checkout@v6
      # extendr-ffi links against R, so R is present for the build.
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  msrv:
    name: Install with the minimum Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # The minimum version is the rustc entry of SystemRequirements in DESCRIPTION.
      - name: Read the minimum Rust version
        id: msrv
        run: echo "version=$(grep -oE 'rustc >= [0-9.]+' DESCRIPTION | awk '{print $3}')" >> "$GITHUB_OUTPUT"
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: Build and install the source package
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
        run: |
          R CMD build --no-manual .
          R CMD INSTALL rtemis.ml_*.tar.gz
          Rscript -e 'stopifnot(rtemis.ml::roc_auc(c(0L, 1L), c(0.2, 0.8)) == 1)'
      # CRAN builds install the committed R/extendr-wrappers.R; a development
      # build regenerates it from the Rust doc comments, and the two must match.
      - name: Check that R/extendr-wrappers.R is current
        env:
          RUSTUP_TOOLCHAIN: ${{ steps.msrv.outputs.version }}
          NOT_CRAN: "true"
        run: |
          R CMD INSTALL --no-test-load .
          git diff --exit-code R/extendr-wrappers.R
